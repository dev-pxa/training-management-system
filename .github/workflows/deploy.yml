name: Deploy Management System Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-management-system-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy management system beta
    runs-on: ubuntu-latest
    env:
      BETA_SSH_HOST: ${{ secrets.BETA_TENCENT_CLOUD_HOST }}
      BETA_SSH_USER: ${{ secrets.BETA_TENCENT_CLOUD_USER }}
      BETA_SSH_PORT: ${{ secrets.BETA_TENCENT_CLOUD_PORT }}
      BETA_SSH_PRIVATE_KEY: ${{ secrets.BETA_TENCENT_CLOUD_SSH_KEY }}
      BETA_DEPLOY_PATH: ${{ secrets.BETA_TENCENT_CLOUD_DEPLOY_PATH }}
      BETA_WEB_PORT: ${{ secrets.BETA_WEB_PORT }}
      BETA_BACKEND_URL: ${{ secrets.BETA_BACKEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize deployment variables
        run: |
          test -n "$BETA_SSH_HOST" || (echo "Missing secret: BETA_TENCENT_CLOUD_HOST" && exit 1)
          test -n "$BETA_SSH_USER" || (echo "Missing secret: BETA_TENCENT_CLOUD_USER" && exit 1)
          test -n "$BETA_SSH_PRIVATE_KEY" || (echo "Missing secret: BETA_TENCENT_CLOUD_SSH_KEY" && exit 1)
          echo "SSH_HOST=$BETA_SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_USER=$BETA_SSH_USER" >> "$GITHUB_ENV"
          echo "SSH_PORT=${BETA_SSH_PORT:-22}" >> "$GITHUB_ENV"
          echo "SSH_PRIVATE_KEY<<EOF" >> "$GITHUB_ENV"
          echo "$BETA_SSH_PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=${BETA_DEPLOY_PATH:-/opt/training-management-system}" >> "$GITHUB_ENV"
          echo "WEB_PORT=${BETA_WEB_PORT:-80}" >> "$GITHUB_ENV"
          echo "BACKEND_URL=${BETA_BACKEND_URL:-http://host.docker.internal:8080}" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tencent_cloud_deploy_key
          chmod 600 ~/.ssh/tencent_cloud_deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy by SSH script
        run: |
          SSH_KEY_PATH=~/.ssh/tencent_cloud_deploy_key ./scripts/deploy-ssh.sh
